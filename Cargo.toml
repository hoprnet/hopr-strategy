[package]
authors      = ["HOPR Association <tech@hoprnet.org>"]
categories   = ["network-programming"]
description  = "Contains implementations of different HOPR strategies"
edition      = "2024"
homepage     = "https://hoprnet.org/"
include      = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]
keywords     = ["channels", "hopr", "strategy"]
license      = "GPL-3.0-only"
name         = "hopr-strategy"
readme       = "README.md"
repository   = "https://github.com/hoprnet/hopr-strategy"
rust-version = "1.97"
version      = "3.0.0"

[lib]
crate-type = ["rlib"]

[features]
default       = ["runtime-tokio"]
runtime-tokio = ["hopr-utils/runtime-tokio"]
telemetry     = ["hopr-api/types-telemetry"]
## Exposes `crate::testing` node adapters to downstream test crates.
testing = [
  "dep:async-broadcast",
  "dep:blokli-client",
  "dep:serde_json",
  "dep:tokio",
  "hopr-api/types-with-bindings",
  "hopr-utils/testing-blokli",
]
## Strategy features — each enables one strategy implementation.
strategy-auto-funding      = []
strategy-auto-redeeming    = []
strategy-channel-lifecycle = []
strategy-closure-finalizer = []
# The PIX strategy engine, without a deposit pool.
#
# `DepositPool` is generic over its keypair, and `K::Public` is the deposit address the pool can
# settle to. That has to match the address type `HoprPixSpec` produces, which is chosen by a
# feature on `hopr-crypto-packet` — an entirely separate crate. Enabling this alone gives the
# generic engine and `PixStrategy::build_with_pool`, for a consumer bringing its own pool.
#
# Consumers that want a bundled pool also enable one of the two pairings below. Those two are
# additive, not exclusive: each lives in its own module with its own builder, so enabling both is
# well-defined and is what `--all-features` does. Which pool runs is decided at the call site.
strategy-pix = [
  "dep:backon",
  "dep:chacha20poly1305",
  "dep:redb",
  "dep:scrypt",
  "dep:subtle",
  "dep:tokio",
]
# `NonAnonymousDepositPool`, keyed on `EthDepositKey` (Ethereum deposit addresses).
#
# **For testing and development only.** The pool settles with plain, fully visible on-chain
# transfers, so every deposit and sweep is linkable — it offers no anonymity at all. The feature is
# named for that intent rather than for the curve it settles on, so it cannot be reached for in
# production by mistake. The module stays `pix::secp256k1`, after the address scheme, and the
# `hopr-lib/pix-secp256k1` pairing below is unchanged.
#
# Pair with `hopr-crypto-packet/pix-secp256k1` — reached through `hopr-lib/pix-secp256k1` — or
# the pool cannot spend the addresses the events carry. Cargo cannot express "these two must
# agree" across crates, so the consumer states both and `hoprd::strategy` asserts the result.
strategy-pix-test = ["strategy-pix"]
# `CurvyDepositPool`, keyed on `BjjKeypair` (Baby JubJub deposit addresses).
#
# Pair with `hopr-crypto-packet/pix-bjj`, which is the default, so a consumer enabling this
# feature and nothing else already agrees.
#
# NOTE: the pool itself is a stub whose methods panic. The feature wiring is final; the
# implementation is not.
strategy-pix-curvy = ["strategy-pix"]

[dependencies]
anyhow              = { workspace = true }
async-trait         = { workspace = true }
bytesize            = { workspace = true }
dashmap             = { workspace = true, features = ["inline"] }
futures             = { workspace = true }
futures-concurrency = { workspace = true }
futures-time        = { workspace = true }
humantime-serde     = { workspace = true }
lazy_static         = { workspace = true }
serde               = { workspace = true, features = ["derive"] }
serde_with          = { workspace = true }
smart-default       = { workspace = true }
statrs              = { workspace = true }
thiserror           = { workspace = true }
tracing             = { workspace = true }
validator           = { workspace = true, features = ["derive"] }

hopr-api = { workspace = true, features = [
  "node",
  "serde",
  "types-chain",
  "types-internal",
] }
hopr-utils = { workspace = true, default-features = false }
moka = { workspace = true, features = ["sync"] }
multiaddr = { workspace = true }
parking_lot = { workspace = true }

# Optional deps enabled by the `testing` feature
async-broadcast = { workspace = true, optional = true }
blokli-client = { workspace = true, optional = true, features = ["testing"] }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
  "macros",
  "rt",
  "sync",
  "time",
] }

# PIX (non-anonymous) strategy support — enabled via the `strategy-pix` feature.
backon = { workspace = true, features = [
  "futures-timer-sleep",
], optional = true }
chacha20poly1305 = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
scrypt = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }

[dev-dependencies]
chrono = { workspace = true, default-features = false, features = [
  "clock",
  "std",
] }
hex-literal = { workspace = true }
hopr-api = { workspace = true, features = ["types-random"] }
hopr-utils = { workspace = true, features = ["runtime-tokio"] }
insta = { workspace = true, features = ["redactions", "yaml"] }
mockall = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "tracing",
] }

[workspace]
members  = ["tests/integration"]
resolver = "3"

[workspace.dependencies]
anyhow              = "1.0.104"
async-broadcast     = "0.7.2"
async-trait         = "0.1.92"
backon              = { version = "1.6.0", default-features = false }
blokli-client       = "0.31.0"
bytesize            = { version = "2.7.0", features = ["serde"] }
chacha20poly1305    = "0.11.0"
chrono              = { version = "0.4.45", default-features = false }
dashmap             = "6.2.1"
futures             = "0.3.34"
futures-concurrency = "7.7.1"
futures-time        = "3.1.0"
hex-literal         = "1.1.0"
hopr-api            = "4.0.0"
hopr-strategy       = { path = "." }
hopr-utils          = { package = "hopr-utilities", version = "0.10.0", default-features = false }
humantime-serde     = "1.1.1"
insta               = "1.48.0"
lazy_static         = "1.5.0"
mockall             = "0.15.0"
moka                = "0.12.16"
multiaddr           = "0.18.2"
parking_lot         = "0.12.5"
redb                = "4.2.0"
rstest              = "0.26.1"
scrypt              = "0.12.0"
serde               = "1.0.229"
serde_json          = "1.0.151"
serde_with          = "3.22.0"
smart-default       = "0.7.1"
statrs              = "0.19.1"
subtle              = "2.6.1"
tempfile            = "3.27.0"
test-log            = "0.2.21"
thiserror           = "2.0.20"
tokio               = "1.53.1"
tracing             = "0.1.44"
validator           = "0.21.0"

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]
