[package]
name = "hopr-strategy"
description = "Contains implementations of different HOPR strategies"
version = "0.20.0"
edition = "2024"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["hopr", "strategy", "channels"]
repository = "https://github.com/hoprnet/hopr-strategy"
homepage = "https://hoprnet.org/"
categories = ["network-programming"]
authors = ["HOPR Association <tech@hoprnet.org>"]
rust-version = "1.94"

[lib]
crate-type = ["rlib"]
doctest = false

[features]
default = ["runtime-tokio"]
runtime-tokio = ["hopr-utils/runtime-tokio"]
telemetry = ["hopr-api/types-telemetry"]
## Strategy features — each enables one strategy implementation.
strategy-auto-funding = []
strategy-auto-redeeming = []
strategy-closure-finalizer = []
strategy-channel-lifecycle = []
strategy-pix = ["dep:redb", "dep:scrypt", "dep:chacha20poly1305"]

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
dashmap = { version = "6.2.1", features = ["inline"] }
futures = "0.3.32"
futures-concurrency = "7.7.1"
futures-time = "3.1.0"
humantime-serde = "1.1.1"
lazy_static = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.21.0"
smart-default = "0.7.1"
thiserror = "2.0.18"
tracing = "0.1.44"
validator = { version = "0.20.0", features = ["derive"] }

hopr-api = { git = "https://github.com/hoprnet/hopr-api", branch = "lukas/add-pix-conversions", features = ["node", "serde"] }
hopr-utils = { git = "https://github.com/hoprnet/hoprnet", branch = "lukas/pix", features = ["runtime-tokio"] }
moka = { version = "0.12.15", features = ["sync"] }
multiaddr = "0.18.2"
parking_lot = "0.12.5"
redb = { version = "4.1.0", optional = true }
scrypt = { version = "0.12.0", optional = true }
chacha20poly1305 = { version = "0.10.1", optional = true }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
  "std",
  "clock",
] }
hex-literal = "1.1.0"
hopr-api = { git = "https://github.com/hoprnet/hopr-api", branch = "lukas/add-pix-conversions", features = ["node", "serde", "types-random"] }
hopr-utils = { git = "https://github.com/hoprnet/hoprnet", branch = "lukas/pix", features = ["runtime-tokio"] }
hopr-chain-connector = { git = "https://github.com/hoprnet/hoprnet", branch = "lukas/pix", features = [
  "testing",
  "runtime-tokio",
] }
insta = { version = "1.48.0", features = ["yaml", "redactions"] }
mockall = "0.15.0"
test-log = { version = "0.2.21", features = ["trace"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "tracing"] }

[workspace]

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[package.metadata.cargo-shear]
ignored = []
