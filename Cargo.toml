[package]
authors      = ["HOPR Association <tech@hoprnet.org>"]
categories   = ["network-programming"]
description  = "Contains implementations of different HOPR strategies"
edition      = "2024"
homepage     = "https://hoprnet.org/"
include      = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]
keywords     = ["channels", "hopr", "strategy"]
license      = "GPL-3.0-only"
name         = "hopr-strategy"
readme       = "README.md"
repository   = "https://github.com/hoprnet/hopr-strategy"
rust-version = "1.97"
version      = "4.1.0"

[lib]
crate-type = ["rlib"]

[features]
default       = ["runtime-tokio"]
runtime-tokio = ["hopr-utils/runtime-tokio"]
telemetry     = ["hopr-api/types-telemetry"]
## Exposes `crate::testing` node adapters to downstream test crates.
testing = [
  "blokli-client/testing",
  "dep:async-broadcast",
  "dep:blokli-client",
  "dep:serde_json",
  "dep:tokio",
  "hopr-api/types-with-bindings",
  "hopr-utils/testing-blokli",
]
## Strategy features — each enables one strategy implementation.
strategy-auto-funding      = []
strategy-auto-redeeming    = []
strategy-channel-lifecycle = []
strategy-closure-finalizer = []
# The PIX strategy engine, without a deposit pool.
strategy-pix = [
  "dep:backon",
  "dep:chacha20poly1305",
  "dep:redb",
  "dep:scrypt",
  "dep:subtle",
  "dep:tokio",
]
# `NonAnonymousDepositPool`, keyed on `EthDepositKey` (Ethereum deposit addresses).
#
# **For testing and development only.** The pool settles with plain, fully visible on-chain
# transfers, so every deposit and sweep is linkable — it offers no anonymity at all.
strategy-pix-test = ["dep:hopr-chain-connector", "strategy-pix"]
# `CurvyDepositPool`, keyed on `BjjKeypair` (Baby JubJub deposit addresses): settlement through
# the Curvy shielded pool, with per-SSA stealth scan identities for private note discovery.
#
# Pair with `hopr-crypto-packet/pix-bjj`, which is the default, so a consumer enabling this
# feature and nothing else already agrees.
#
# Pulls in the Curvy SDK (`curvy-sdk`, git-only for now, which is why this crate cannot be
# published to crates.io while the feature exists — see the README), the Curvy stealth-address
# and note primitives (`curvy-core`), and `blokli-client`'s `curvy` query surface for note
# discovery.
strategy-pix-curvy = [
  "blokli-client/curvy",
  "dep:babyjubjub-ec",
  "dep:blokli-client",
  "dep:const-hex",
  "dep:curvy-chain-blokli",
  "dep:curvy-core",
  "dep:curvy-sdk",
  "dep:serde_json",
  "dep:zeroize",
  "hopr-api/types-curvy",
  "strategy-pix",
]

[dependencies]
anyhow              = { workspace = true }
async-trait         = { workspace = true }
bytesize            = { workspace = true }
dashmap             = { workspace = true, features = ["inline"] }
futures             = { workspace = true }
futures-concurrency = { workspace = true }
futures-time        = { workspace = true }
humantime-serde     = { workspace = true }
lazy_static         = { workspace = true }
serde               = { workspace = true, features = ["derive"] }
serde_with          = { workspace = true }
smart-default       = { workspace = true }
statrs              = { workspace = true }
thiserror           = { workspace = true }
tracing             = { workspace = true }
validator           = { workspace = true, features = ["derive"] }

hopr-api = { workspace = true, features = [
  "node",
  "serde",
  "types-chain",
  "types-internal",
] }
hopr-chain-connector = { workspace = true, optional = true }
hopr-utils = { workspace = true, default-features = false }
moka = { workspace = true, features = ["sync"] }
multiaddr = { workspace = true }
parking_lot = { workspace = true }

# Optional deps enabled by the `testing` feature. `blokli-client` is shared with
# `strategy-pix-curvy`, which is why its `testing` feature is enabled from the feature list
# rather than here — a production curvy build must not inherit the test emulator.
async-broadcast = { workspace = true, optional = true }
blokli-client = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
  "macros",
  "rt",
  "sync",
  "time",
] }

# PIX (non-anonymous) strategy support — enabled via the `strategy-pix` feature.
backon = { workspace = true, features = [
  "futures-timer-sleep",
], optional = true }
chacha20poly1305 = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
scrypt = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }

# Curvy deposit pool — enabled via the `strategy-pix-curvy` feature.
babyjubjub-ec      = { workspace = true, optional = true }
const-hex          = { workspace = true, optional = true }
curvy-chain-blokli = { workspace = true, optional = true }
curvy-core         = { workspace = true, optional = true }
curvy-sdk          = { workspace = true, optional = true }
zeroize            = { workspace = true, optional = true }

[dev-dependencies]
async-broadcast = { workspace = true }
blokli-client = { workspace = true, features = ["testing"] }
chrono = { workspace = true, default-features = false, features = [
  "clock",
  "std",
] }
hex-literal = { workspace = true }
hopr-api = { workspace = true, features = ["types-random"] }
hopr-utils = { workspace = true, features = [
  "runtime-tokio",
  "testing-blokli",
] }
insta = { workspace = true, features = ["redactions", "yaml"] }
mockall = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "tracing",
] }

[workspace]
exclude  = ["vendor"]
members  = ["tests/integration"]
resolver = "3"

# The published `curvy-prover`/`curvy-witness` 0.1.0-rc.3 pin `thiserror = "=2.0.19"`, while
# `hopr-api` 4.x and `hopr-chain-connector` 0.26 require `^2.0.20`; Cargo resolves one 2.x, so
# the two cannot coexist. `vendor/` carries byte-identical copies of both crates with only that
# pin relaxed, patched in here. See `vendor/README.md` — and note that every root workspace that
# consumes this crate has to repeat these two lines, because Cargo only honours `[patch]` from
# the root. Remove both once upstream releases with a compatible requirement.
[patch.crates-io]
curvy-prover  = { path = "vendor/curvy-prover" }
curvy-witness = { path = "vendor/curvy-witness" }

[workspace.dependencies]
anyhow           = "1.0.104"
async-broadcast  = "0.7.2"
async-trait      = "0.1.92"
babyjubjub-ec    = { version = "0.4.0", features = ["arithmetic"] }
backon           = { version = "1.6.0", default-features = false }
blokli-client    = "0.33.1"
bytesize         = { version = "2.7.0", features = ["serde"] }
chacha20poly1305 = "0.11.0"
chrono           = { version = "0.4.45", default-features = false }
const-hex        = "1.19.1"
# The Curvy SDK is git-only: `curvy-core` (and its prover/witness crates) are on crates.io, the
# SDK workspace is not yet. The rev is the one the Curvy team integrated PIX against.
curvy-chain-blokli   = { git = "https://github.com/0xCurvy/rs-sdk", rev = "7040bbb6c0bb8803dab282498be1f05db2710e47" }
curvy-core           = "=0.1.0-rc.3"
curvy-sdk            = { git = "https://github.com/0xCurvy/rs-sdk", rev = "7040bbb6c0bb8803dab282498be1f05db2710e47" }
dashmap              = "6.2.1"
futures              = "0.3.34"
futures-concurrency  = "7.7.1"
futures-time         = "3.1.0"
hex-literal          = "1.1.0"
hopr-api             = "4.1.0"
hopr-chain-connector = "0.26.0"
hopr-strategy        = { path = "." }
hopr-utils           = { package = "hopr-utilities", version = "0.13.0", default-features = false }
humantime-serde      = "1.1.1"
insta                = "1.48.0"
lazy_static          = "1.5.0"
mockall              = "0.15.0"
moka                 = "0.12.16"
multiaddr            = "0.18.2"
parking_lot          = "0.12.5"
redb                 = "4.2.0"
rstest               = "0.26.1"
scrypt               = "0.12.0"
serde                = "1.0.229"
serde_json           = "1.0.151"
serde_with           = "3.22.0"
smart-default        = "0.7.1"
statrs               = "0.19.1"
subtle               = "2.6.1"
tempfile             = "3.27.0"
test-log             = "0.2.21"
thiserror            = "2.0.20"
tokio                = "1.53.1"
tracing              = "0.1.44"
validator            = "0.21.0"
zeroize              = "1.8.1"

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]
