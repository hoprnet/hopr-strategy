[package]
authors      = ["HOPR Association <tech@hoprnet.org>"]
categories   = ["network-programming"]
description  = "Contains implementations of different HOPR strategies"
edition      = "2024"
homepage     = "https://hoprnet.org/"
include      = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]
keywords     = ["channels", "hopr", "strategy"]
license      = "GPL-3.0-only"
name         = "hopr-strategy"
readme       = "README.md"
repository   = "https://github.com/hoprnet/hopr-strategy"
rust-version = "1.94"
version      = "0.20.0"

[lib]
crate-type = ["rlib"]

[features]
default       = ["runtime-tokio"]
runtime-tokio = ["hopr-utils/runtime-tokio"]
telemetry     = ["hopr-api/types-telemetry"]
## Exposes `crate::testing` node adapters to downstream test crates.
testing = ["dep:blokli-client", "dep:async-broadcast", "dep:const-hex", "dep:serde_json", "dep:tokio"]
## Strategy features — each enables one strategy implementation.
strategy-auto-funding      = []
strategy-auto-redeeming    = []
strategy-channel-lifecycle = []
strategy-closure-finalizer = []

[dependencies]
anyhow              = { workspace = true }
async-trait         = { workspace = true }
bytesize            = { workspace = true }
dashmap             = { workspace = true, features = ["inline"] }
futures             = { workspace = true }
futures-concurrency = { workspace = true }
futures-time        = { workspace = true }
humantime-serde     = { workspace = true }
lazy_static         = { workspace = true }
serde               = { workspace = true, features = ["derive"] }
serde_with          = { workspace = true }
smart-default       = { workspace = true }
thiserror           = { workspace = true }
tracing             = { workspace = true }
validator           = { workspace = true, features = ["derive"] }

hopr-api           = { workspace = true, features = ["node", "serde", "types-chain"] }
hopr-crypto-packet = { workspace = true }
hopr-utils         = { workspace = true, default-features = false }
moka               = { workspace = true, features = ["sync"] }
multiaddr          = { workspace = true }
parking_lot        = { workspace = true }

# Optional deps enabled by the `testing` feature
async-broadcast = { workspace = true, optional = true }
blokli-client   = { workspace = true, optional = true, features = ["testing"] }
const-hex       = { workspace = true, optional = true }
serde_json      = { workspace = true, optional = true }
tokio           = { workspace = true, optional = true, features = ["rt", "sync", "macros"] }

[dev-dependencies]
chrono = { workspace = true, default-features = false, features = [
  "clock",
  "std",
] }
hex-literal = { workspace = true }
hopr-api = { workspace = true, features = ["types-random"] }
hopr-utils = { workspace = true, features = ["runtime-tokio"] }
insta = { workspace = true, features = ["redactions", "yaml"] }
mockall = { workspace = true }
serde_json = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "tracing",
] }

[workspace]
members  = ["tests/integration"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.103"
async-broadcast = "0.7.2"
async-trait = "0.1.89"
blokli-client = "0.30.0"
bytesize = { version = "2.4.0", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false }
ctor = "0.2"
dashmap = "6.2.1"
futures = "0.3.32"
futures-concurrency = "7.7.1"
futures-time = "3.1.0"
const-hex = "1.19.1"
hex = "0.4.3"
hex-literal = "1.1.0"
hopli = { git = "https://github.com/hoprnet/hopli", branch = "main" }
hopr-api = "1.15.0"
hopr-bindings = "4.10.0"
hopr-crypto-packet = { git = "https://github.com/hoprnet/hoprnet", branch = "master", default-features = false, features = [
  "ed25519",
] }
hopr-strategy = { path = "." }
hopr-types = "2.0"
hopr-utils = { git = "https://github.com/hoprnet/hoprnet", branch = "master", default-features = false }
humantime-serde = "1.1.1"
insta = "1.48.0"
lazy_static = "1.5.0"
mockall = "0.15.0"
moka = "0.12.15"
multiaddr = "0.18.2"
parking_lot = "0.12.5"
rstest = "0.26.1"
serde = "1.0.228"
serde_json = "1.0.150"
serde_with = "3.21.0"
smart-default = "0.7.1"
test-log = "0.2.21"
thiserror = "2.0.18"
tokio = "1.52.3"
tracing = "0.1.44"
url = "2.5.8"
validator = "0.20.0"

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[package.metadata.cargo-shear]
ignored = ["humantime-serde"]
