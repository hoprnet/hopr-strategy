[advisories]
ignore = [
  "RUSTSEC-2024-0388", # `derivative` unmaintained; only in Cargo.lock via optional `ark-ff` 0.3/0.4 deps of `ruint` (alloy), not compiled
  "RUSTSEC-2024-0436", # `paste` unmaintained; pulled by ark-ff 0.5 -> ark-bn254 -> babyjubjub-ec -> hopr-types
  "RUSTSEC-2026-0173", # `proc-macro-error2` unmaintained; pulled by aquamarine (proc-macro) -> hopr-types
  "RUSTSEC-2026-0249", # `smartstring` unmaintained; requires `opentelemetry-prometheus-text-exporter` > 0.3.0 in hopr-types
  "RUSTSEC-2026-0387", # `crypto-bigint` 0.5.5 timing variability, pulled by elliptic-curve 0.13.8 -> alloy-signer (hopr-bindings -> hopr-types); needs an alloy bump
  "RUSTSEC-2026-0391", # `zstd` 0.13.3 stream data leak; pulled by compression-codecs -> reqwest "brotli" -> blokli-client; needs a blokli-client bump
  "RUSTSEC-2026-0398", # `zstd-safe` 7.3.0 `Seekable::decompress`; same root cause as 0391
  "RUSTSEC-2026-0403", # `zstd-safe` 7.3.0 uninitialized memory on legacy frame; same root cause as 0391
]
