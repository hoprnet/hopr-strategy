---
################################################################################
# Pull request pipeline for hopr-strategy
#
# Validates PR metadata, runs code-quality checks and tests via shared
# workflows, then builds the library.
################################################################################
name: PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  # ── PR metadata ──────────────────────────────────────────────────────────────
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04-2
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
            ci
            revert
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request'
    # Fork PRs get a read-only token and cannot write labels; stay green so the gate passes.
    continue-on-error: true
    runs-on: depot-ubuntu-24.04-2
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/labeler@77a4082b841706ac431479b7e2bb11216ffef250 # main on 20.02.2025
        with:
          sync-labels: true
      - name: Add "external" label for forked PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "external"
          fi
  # Gate jobs through inputs on the reusable workflows, not with a caller-level
  # `if:`: an input-skipped inner job still reports its required check name as
  # skipped (green), a skipped caller job does not. Merge-queue runs always
  # run everything.
  changes:
    name: Detect changes
    runs-on: depot-ubuntu-24.04-2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      lockfile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lockfile == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "src/**"
              - "tests/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "rustfmt.toml"
              - ".cargo/**"
              - "justfile"
              - "deno.json"
              - "codecov.yml"
              - "flake.nix"
              - "flake.lock"
              - "nix/**"
              - ".github/workflows/**"
            lockfile:
              - "Cargo.toml"
              - "Cargo.lock"
  # ── Shared checks (lint, pre-commit, audit) ─────────────────────────────────
  checks:
    name: Check
    needs: changes
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@3ee95c480962bb3c1fc0061887da9ba735f537c7 # workflow-checks-v2.1.1
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      lint_command: "nix develop --command just quick"
      audit_command: "nix run -L .#audit"
      deps: true
      # Format and pre-commit cover every file type and always run.
      lint: ${{ needs.changes.outputs.rust == 'true' }}
      audit: ${{ needs.changes.outputs.lockfile == 'true' }}
      runner_small: depot-ubuntu-24.04-2
      runner_large: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # ── Shared tests (unit) ─────────────────────────────────────────────────────
  tests:
    name: Test
    needs: changes
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload in the coverage jobs
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@3ee95c480962bb3c1fc0061887da9ba735f537c7 # workflow-tests-v6.1.1
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      enable_unit_tests: false
      enable_unit_coverage: ${{ needs.changes.outputs.rust == 'true' }}
      unit_coverage_command: "nix build -L .#coverage -o coverage.lcov"
      enable_integration_tests: ${{ needs.changes.outputs.rust == 'true' }}
      integration_test_command: "nix build -L .#integration-tests"
      enable_integration_coverage: ${{ needs.changes.outputs.rust == 'true' }}
      integration_coverage_command: "nix build -L .#coverage-integration -o coverage.lcov"
      test_timeout: 30
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # ── Build: library ─────────────────────────────────────────────────────────
  build-library:
    name: Library ${{ matrix.architecture }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-4
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-arm-4
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: depot-macos-15
            required_label: "binary:aarch64-darwin"
    uses: hoprnet/hopr-workflows/.github/workflows/build-library.yaml@3d291616a704bea189af1f16cefc25e26d2857c0 # build-library-v3.2.0
    permissions:
      contents: read
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      build_file: Cargo.toml
      build_command: "nix build -L .#lib-hopr-strategy-${{ matrix.architecture }}"
      package_name: hopr-strategy
      runner: ${{ matrix.runner }}
      enabled: ${{ needs.changes.outputs.rust == 'true' && (matrix.required_label == '' || github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, matrix.required_label)) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # Single aggregate merge gate: green only if every other job in this run
  # succeeded. Mark THIS one as the required check in the branch ruleset.
  # `if: always()` runs it even when a dependency fails; alls-green then reds
  # the gate on any non-success (a failed job, or a skip that is not allowed).
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - validate-pr-title
      - label
      - changes
      - checks
      - tests
      - build-library
    runs-on: depot-ubuntu-24.04-2
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # validate-pr-title and label run on pull_request only. `tests` and
          # `build-library` are input-gated on `changes.outputs.rust`; when every
          # inner job of the reusable workflow skips, the caller job reports
          # skipped as well. Their skip is allowed only for a non-Rust change.
          allowed-skips: ${{ needs.changes.outputs.rust == 'true' && 'validate-pr-title, label' || 'validate-pr-title, label, tests, build-library' }}
