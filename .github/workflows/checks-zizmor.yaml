---
name: Zizmor
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/**"
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-zizmor
  cancel-in-progress: true
permissions: {}
jobs:
  zizmor:
    uses: hoprnet/hopr-workflows/.github/workflows/checks-zizmor.yaml@feat/fork-pr-ci-support
    permissions:
      contents: read
      security-events: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
