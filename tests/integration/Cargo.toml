[package]
autolib = false
edition = "2021"
name    = "hopr-strategy-integration-tests"
publish = false
version = "0.1.0"

[dev-dependencies]

anyhow = { workspace = true }
blokli-client = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["clock", "std"] }
clap = { workspace = true, features = ["derive", "env", "string"] }
futures = { workspace = true }
futures-time = { workspace = true }
hex = { workspace = true }
hopli = { workspace = true }
hopr-api = { workspace = true, features = ["node", "serde"] }
hopr-bindings = { workspace = true }
hopr-chain-connector = { workspace = true, features = ["runtime-tokio"] }
hopr-strategy = { workspace = true, features = [
  "runtime-tokio",
  "strategy-auto-funding",
] }
hopr-types = { workspace = true, features = [
  "chain",
  "crypto",
  "internal",
  "primitive",
] }
libc = { workspace = true }
rand = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
