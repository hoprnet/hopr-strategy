[package]
edition = "2021"
name    = "hopr-strategy-integration-tests"
publish = false
version = "0.1.0"

[dependencies]

anyhow   = { workspace = true }
futures  = { workspace = true }
hopr-api = { workspace = true, features = ["node", "serde"] }
# `strategy-pix-test` rather than bare `strategy-pix`: the latter is the pool-less engine,
# and `tests/pix.rs` drives a concrete pool — `build_non_anonymous` and
# `plain::NonAnonymousDepositPoolConfig` exist only once that pool's feature is on. Only the
# `plain` pool is enabled here: it settles on the emulated chain these fixtures provide, whereas
# the curvy pool settles in a Curvy deployment the emulator does not model. The curvy pool is
# tested in-crate over a scripted note index and a fake SDK bridge (`pix::pools::curvy::tests`),
# and end to end through hoprd's localcluster. The two features are additive, so adding it here
# later needs no restructuring.
hopr-strategy = { workspace = true, features = [
  "runtime-tokio",
  "strategy-auto-funding",
  "strategy-auto-redeeming",
  "strategy-channel-lifecycle",
  "strategy-closure-finalizer",
  "strategy-pix-test",
  "testing",
] }
rstest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }

[dev-dependencies]

bytesize = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
