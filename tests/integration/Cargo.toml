[package]
edition = "2021"
name    = "hopr-strategy-integration-tests"
publish = false
version = "0.1.0"

[dependencies]

anyhow   = { workspace = true }
futures  = { workspace = true }
hopr-api = { workspace = true, features = ["node", "serde"] }
# `strategy-pix-secp256k1` rather than bare `strategy-pix`: the latter is the pool-less engine,
# and `tests/pix.rs` drives a concrete pool — `build_non_anonymous` and
# `secp256k1::NonAnonymousDepositPoolConfig` exist only once that pool's feature is on. Only
# secp256k1 is enabled because these tests own that in-crate pool. Curvy integration tests belong
# with the connector-provided pool in `hopr-impls`; the two strategy features remain additive.
hopr-strategy = { workspace = true, features = [
  "runtime-tokio",
  "strategy-auto-funding",
  "strategy-auto-redeeming",
  "strategy-channel-lifecycle",
  "strategy-closure-finalizer",
  "strategy-pix-secp256k1",
  "testing",
] }
rstest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }

[dev-dependencies]

bytesize = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
